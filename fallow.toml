# Fallow: dead code, circular deps, duplication, complexity, architecture boundaries.
# Docs: https://docs.fallow.tools

# test/fixtures/ holds fake repos and plans: data, never code of this package.
ignorePatterns = ["test/fixtures/**"]

entry = [
  "src/index.ts",
  "src/**/*.test.ts",
  "test/**/*.test.ts",
]

# CLI/tooling deps used via command line or config files, not imported from source.
ignoreDependencies = ["@ast-grep/cli"]

# bin/keyframes.js imports the built CLI, which exists only after `pnpm build`.
# Its source, src/cli.ts, is analyzed directly; test/e2e/bin.test.ts runs the bin.
ignoreUnresolvedImports = ["../dist/cli.js"]

[rules]
unused-exports = "error"
unused-files = "error"
unused-dependencies = "error"
circular-dependencies = "error"
boundary-violation = "error"

[duplicates]
mode = "mild"
minTokens = 50

[health]
maxCyclomatic = 15
maxCognitive = 15
