name: Publish

# Publishes @robmclarty/keyframes to npm with provenance when a vX.Y.Z tag is
# pushed. Auth is npm Trusted Publishing (OIDC): no token exists anywhere - the
# registry trusts this exact workflow's identity, minted per run, so there is no
# secret to leak or rotate and no 2FA bypass. Provenance links the published
# tarball to this commit and workflow run, verifiable on npmjs.com and via
# `npm audit signatures`.
#
# One-time setup outside the repo (all three before the first CI publish):
#   - GitHub: repo Settings -> Environments -> npm-publish, with a required
#     reviewer (yourself). The run pauses there until approved - the CI
#     equivalent of the local MFA prompt this replaces. Create it before the
#     first tag push: a job naming an environment that doesn't exist creates
#     it unprotected and runs at once.
#   - The very first version is published by hand - a trusted publisher is
#     configured on the package's settings page, which only exists once the
#     package does: `npm publish --access public` from the tagged checkout,
#     while this run waits at the environment. Approve it after; the version is
#     on npm by then, so it's skipped, and the run stays green.
#   - npmjs.com: package @robmclarty/keyframes -> Settings -> Trusted Publisher
#     -> GitHub Actions, repository robmclarty/keyframes, workflow filename
#     publish.yaml, environment npm-publish.
# Provenance needs a public repository; the publish fails closed on a private one.
#
# release.yaml (the GitHub Release for the same tag) stays a separate workflow
# so its `contents: write` never shares a job with `id-token: write`.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from the Actions tab
  # - the tarball contents are identical. The version guard below re-checks that
  # HEAD still matches the tag, and an already-published version is skipped
  # rather than refused.
  workflow_dispatch:

permissions:
  contents: read # checkout only
  id-token: write # OIDC identity for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # required-reviewer gate: the human approval step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail fast when the tag and package.json disagree - a mistagged push
      # would otherwise publish a version whose tag points at the wrong code.
      # On workflow_dispatch (the manual re-run hatch) there is no pushed tag:
      # instead require that v<version> exists on origin and points at HEAD, so
      # a retry can only republish exactly what the tag froze.
      - name: Verify tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            if ! git fetch --force --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::tag $version not found on origin"
              exit 1
            fi
            if [ "$(git rev-parse "$version^{}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $version does not point at HEAD"
              exit 1
            fi
          fi

      # Reads the pinned pnpm version from package.json#packageManager. Must
      # run before setup-node so its pnpm cache can find the binary.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate. A release must be green.
      - name: pnpm check
        run: pnpm check

      - name: Upload check report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-check-report
          path: |
            .check/
            !.check/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # npm (not pnpm) publish: the OIDC token exchange is an npm CLI flow. The
      # prepack script deletes dist/ and rebuilds it, so the tarball holds a
      # fresh build. --provenance is redundant under trusted publishing but
      # documents intent and fails closed if the OIDC identity is ever absent.
      # A version already on the registry (the hand-published first release, or
      # a retry after a success) is skipped rather than failed, so the tag push
      # stays green.
      - name: Publish with provenance
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --provenance --access public
