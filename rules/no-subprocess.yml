id: no-subprocess
language: typescript
severity: error
message: |
  `check` starts no process (docs/prototype.md, Build constraints), so
  nothing in `src/` imports `child_process`.
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
rule:
  all:
    - kind: string
    - regex: "^['\"](node:)?child_process['\"]$"
    - inside:
        any:
          - kind: import_statement
          - kind: export_statement
