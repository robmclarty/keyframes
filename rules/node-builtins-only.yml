id: node-builtins-only
language: typescript
severity: error
message: |
  The package has no runtime dependencies (docs/prototype.md, Build
  constraints), so `src/` imports `node:` builtins and relative paths only.
  Tests may import dev dependencies such as vitest.
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
rule:
  all:
    - kind: string
    - inside:
        any:
          - kind: import_statement
          - kind: export_statement
    - not:
        regex: "^['\"](node:|\\.)"
