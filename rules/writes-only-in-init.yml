id: writes-only-in-init
language: typescript
severity: error
message: |
  `check` writes nothing (docs/prototype.md, Build constraints). Only `init`
  writes, and filesystem writes live only in `src/init/`.
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
  - 'src/init/**'
note: |
  Each `any` branch matches the call's function node directly. A shared
  `$FN` metavariable with a `constraints:` regex fails here: the first
  pattern binds `$FN` to the whole `fs.mkdirSync`, the regex rejects it, and
  ast-grep doesn't fall back to the member branch.
rule:
  any:
    - kind: call_expression
      has:
        field: function
        kind: identifier
        regex: '^(writeFile|appendFile|mkdir|mkdtemp|rm|rmdir|rename|copyFile|cp|unlink|symlink|link|truncate|chmod|chown|utimes|createWriteStream)(Sync)?$'
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        has:
          field: property
          regex: '^(writeFile|appendFile|mkdir|mkdtemp|rm|rmdir|rename|copyFile|cp|unlink|symlink|link|truncate|chmod|chown|utimes|createWriteStream)(Sync)?$'
