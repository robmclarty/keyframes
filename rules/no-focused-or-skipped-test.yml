id: no-focused-or-skipped-test
language: typescript
severity: error
message: |
  `.only` hides the rest of the suite, and `.skip` or `.todo` hide a test that
  isn't running. Drop the modifier or delete the test. A skipped test can't
  back a keyframes constraint, yet a `file:...#"title"` pointer would still
  find its title and report the constraint as linked.
note: |
  Adapted from agent-tools' ast-grep-rules starter catalogue (it adds `todo`
  and is an error here, not a warning).
rule:
  pattern: $FN.$MODIFIER($$$ARGS)
constraints:
  FN:
    regex: '^(it|test|describe)$'
  MODIFIER:
    regex: '^(only|skip|todo)$'
ignores:
  - '**/*.d.ts'
  - 'test/fixtures/**'
