id: centralize-subprocess
language: typescript
severity: error
message: |
  C3 (read-only-check): `check` spawns nothing except the configured
  extractor, so `child_process` is imported only in `src/extract/`.
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
  - 'src/extract/**'
rule:
  all:
    - kind: string
    - regex: "^['\"](node:)?child_process['\"]$"
    - inside:
        any:
          - kind: import_statement
          - kind: export_statement
