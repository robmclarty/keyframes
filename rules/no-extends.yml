id: no-extends
language: typescript
severity: error
message: 'Functional style (docs/prototype.md, Build constraints): no inheritance. Compose with type intersections and functions.'
files:
  - 'src/**/*.ts'
  - 'test/**/*.ts'
ignores:
  - 'test/fixtures/**'
rule:
  any:
    - kind: class_heritage
    - kind: extends_clause
    - kind: extends_type_clause
